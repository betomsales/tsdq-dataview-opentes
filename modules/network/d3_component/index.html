<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <style>
    html,
    body {
      margin: 0;
      overflow: hidden;
      padding: 0;
    }

    .network-d3-root {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      box-sizing: border-box;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
      width: 100%;
    }

    .network-d3-toolbar {
      align-items: center;
      background: #f8fafc;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      gap: 12px;
      justify-content: space-between;
      padding: 10px 12px;
    }

    .network-d3-modes {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .network-d3-modes button,
    .network-d3-time button {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      color: #334155;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      line-height: 1.1;
      padding: 7px 10px;
    }

    .network-d3-modes button.active {
      background: #111827;
      border-color: #111827;
      color: #ffffff;
    }

    .network-d3-time {
      align-items: center;
      display: flex;
      gap: 8px;
      min-width: 260px;
    }

    .network-d3-time[hidden] {
      display: none;
    }

    .network-d3-time input {
      accent-color: #111827;
      width: min(340px, 34vw);
    }

    .network-d3-time span {
      color: #334155;
      font-size: 13px;
      min-width: 140px;
      white-space: nowrap;
    }

    .network-d3-status,
    .network-d3-legend {
      color: #64748b;
      font-size: 13px;
      white-space: nowrap;
    }

    .network-d3-stage {
      position: relative;
    }

    .network-d3-svg {
      display: block;
      width: 100%;
    }

    .network-node {
      cursor: grab;
    }

    .network-node:active {
      cursor: grabbing;
    }

    .node-label {
      fill: #1f2937;
      font-size: 11px;
      font-weight: 650;
      pointer-events: none;
    }

    .network-node.selected .node-label {
      font-weight: 800;
    }

    .network-d3-card {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid #d1d5db;
      border-radius: 8px;
      bottom: 12px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
      box-sizing: border-box;
      color: #111827;
      min-width: 210px;
      padding: 12px;
      position: absolute;
      right: 12px;
    }

    .network-d3-card-title {
      font-size: 16px;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 2px;
    }

    .network-d3-card-sub {
      color: #64748b;
      font-size: 12px;
      margin-bottom: 10px;
    }

    .network-d3-card-grid {
      display: grid;
      gap: 4px 14px;
      grid-template-columns: auto auto;
    }

    .network-d3-card-grid span {
      color: #64748b;
    }

    .network-d3-card-grid strong {
      text-align: right;
    }

    .network-d3-legend {
      align-items: center;
      border-top: 1px solid #e5e7eb;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      padding: 8px 12px 10px;
    }

    .network-d3-legend i {
      border-radius: 999px;
      display: inline-block;
      height: 10px;
      margin-right: 6px;
      width: 10px;
    }

    .network-d3-legend .ok {
      background: #2ECC71;
    }

    .network-d3-legend .warn {
      background: #F1C40F;
    }

    .network-d3-legend .bad {
      background: #E74C3C;
    }

    .network-d3-legend .empty {
      background: #d9d9d9;
    }

    @media (max-width: 720px) {
      .network-d3-toolbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .network-d3-status,
      .network-d3-time span {
        white-space: normal;
      }

      .network-d3-time {
        min-width: 100%;
        width: 100%;
      }

      .network-d3-time input {
        flex: 1;
        width: auto;
      }

      .network-d3-card {
        bottom: 8px;
        left: 8px;
        right: 8px;
      }
    }
  </style>
</head>
<body>
  <div id="network-d3-root" class="network-d3-root">
    <div class="network-d3-toolbar">
      <div class="network-d3-modes" aria-label="Modo de visualização">
        <button type="button" data-mode="three" class="active">3 fases</button>
        <button type="button" data-mode="A">Fase A</button>
        <button type="button" data-mode="B">Fase B</button>
        <button type="button" data-mode="C">Fase C</button>
        <button type="button" data-mode="min">Mín</button>
        <button type="button" data-mode="max">Máx</button>
        <button type="button" data-mode="mean">Média</button>
        <button type="button" data-mode="spread">Spread</button>
      </div>
      <div class="network-d3-time" hidden>
        <button type="button" data-play>Play</button>
        <input type="range" min="0" max="0" value="0" step="1" data-frame>
        <span data-time-label></span>
      </div>
      <span class="network-d3-status"></span>
    </div>
    <div class="network-d3-stage">
      <svg class="network-d3-svg" role="img"></svg>
      <div class="network-d3-card" hidden></div>
    </div>
    <div class="network-d3-legend">
      <span><i class="ok"></i>Adequado</span>
      <span><i class="warn"></i>Precário</span>
      <span><i class="bad"></i>Crítico</span>
      <span><i class="empty"></i>Sem medição</span>
    </div>
  </div>

  <script>
    const Streamlit = {
      setComponentReady() {
        window.parent.postMessage(
          {
            isStreamlitMessage: true,
            type: "streamlit:componentReady",
            apiVersion: 1,
          },
          "*"
        );
      },
      setFrameHeight(height) {
        window.parent.postMessage(
          {
            isStreamlitMessage: true,
            type: "streamlit:setFrameHeight",
            height,
          },
          "*"
        );
      },
      setComponentValue(value) {
        window.parent.postMessage(
          {
            isStreamlitMessage: true,
            type: "streamlit:setComponentValue",
            value,
            dataType: "json",
          },
          "*"
        );
      },
    };

    const root = document.getElementById("network-d3-root");
    const status = root.querySelector(".network-d3-status");
    const info = root.querySelector(".network-d3-card");
    const svgElement = root.querySelector(".network-d3-svg");
    const stage = root.querySelector(".network-d3-stage");
    const timeControls = root.querySelector(".network-d3-time");
    const playButton = root.querySelector("[data-play]");
    const frameSlider = root.querySelector("[data-frame]");
    const timeLabel = root.querySelector("[data-time-label]");

    let simulation = null;
    let timerId = null;
    let mode = "three";
    let activeId = null;
    let nodes = [];
    let links = [];
    let frames = [];
    let frameIndex = 0;
    let graphId = "network";
    let restoredLayout = false;
    let lastLayoutSave = 0;
    let lastServerFrameIndex = null;
    const phases = ["A", "B", "C"];

    window.addEventListener("message", (event) => {
      const data = event.data || {};

      if (data.type !== "streamlit:render") {
        return;
      }

      renderComponent(data.args || {});
    });

    Streamlit.setComponentReady();

    function renderComponent(args) {
      if (!window.d3) {
        status.textContent = "D3 não carregado";
        updateFrameHeight(args.height || 640);
        return;
      }

      stopTimeline();
      const graphData = args.graph_data || { nodes: [], edges: [], frames: [] };
      nodes = (graphData.nodes || []).map((item) => ({ ...item }));
      links = (graphData.edges || []).map((item) => ({ ...item }));
      frames = graphData.frames || [];
      graphId = graphData.graphId || "network";
      restoredLayout = restoreLayout(graphData.layoutState);
      const lastFrame = Math.max(frames.length - 1, 0);
      const incomingFrameIndex = clampFrameIndex(
        graphData.initialFrame,
        lastFrame
      );
      const keepLocalFrame = (
        lastServerFrameIndex !== null
        && incomingFrameIndex === lastServerFrameIndex
      );
      frameIndex = keepLocalFrame
        ? clampFrameIndex(frameIndex, lastFrame)
        : incomingFrameIndex;
      lastServerFrameIndex = incomingFrameIndex;
      activeId = args.selected_node_id || null;
      const height = Number(args.height) || 640;

      stage.style.height = `${height}px`;
      svgElement.style.height = `${height}px`;
      status.textContent = `${nodes.length} barramentos / ${links.length} elementos`;
      info.hidden = true;
      drawGraph(height);
      setupTimeline();

      if (frames.length > 0) {
        applyFrame(frameIndex);
      } else {
        refreshColors();
      }

      refreshSelection();
      const activeNode = nodes.find((item) => item.id === activeId);

      if (activeNode) {
        renderInfo(activeNode);
      }

      updateFrameHeight(height);
    }

    function drawGraph(height) {
      d3.select(svgElement).selectAll("*").remove();

      const width = Math.max(root.getBoundingClientRect().width || 960, 320);
      const svg = d3
        .select(svgElement)
        .attr("viewBox", [0, 0, width, height])
        .attr("width", "100%")
        .attr("height", height);

      const layer = svg.append("g");
      const linkLayer = layer.append("g").attr("class", "links");
      const nodeLayer = layer.append("g").attr("class", "nodes");

      svg.call(
        d3.zoom()
          .scaleExtent([0.25, 3])
          .on("zoom", (event) => {
            layer.attr("transform", event.transform);
          })
      );

      simulation = d3
        .forceSimulation(nodes)
        .force(
          "link",
          d3.forceLink(links)
            .id((item) => item.id)
            .distance((item) => item.measurements ? 88 : 74)
            .strength(0.75)
        )
        .force("charge", d3.forceManyBody().strength(-245))
        .force("center", d3.forceCenter(width / 2, height / 2))
        .force("collide", d3.forceCollide().radius(29));

      if (restoredLayout) {
        simulation.alpha(0.08).alphaDecay(0.12);
      }

      linkLayer
        .selectAll("line")
        .data(links)
        .join("line")
        .attr("class", "network-link")
        .attr("stroke", (item) => item.measurements ? "#8796a5" : "#c4cad1")
        .attr("stroke-width", (item) => item.measurements ? 3.2 : 2.2)
        .attr("stroke-linecap", "round")
        .attr("opacity", 0.82);

      const node = nodeLayer
        .selectAll("g")
        .data(nodes)
        .join("g")
        .attr("class", "network-node")
        .call(drag(simulation))
        .on("click", (_event, item) => {
          activeId = item.id;
          saveLayout();
          Streamlit.setComponentValue(selectionPayload(item));
          renderInfo(item);
          refreshSelection();
        });

      node
        .append("circle")
        .attr("class", "node-fill")
        .attr("r", 18);

      node
        .append("circle")
        .attr("class", "node-ring")
        .attr("r", 20)
        .attr("fill", "none")
        .attr("stroke", (item) => item.borderColor)
        .attr("stroke-width", 3.2);

      node
        .append("text")
        .attr("class", "node-label")
        .attr("dy", 34)
        .attr("text-anchor", "middle")
        .text((item) => item.label);

      node
        .append("title")
        .text((item) => tooltipText(item));

      simulation.on("tick", () => {
        updateGraphPositions();
        saveLayoutThrottled();
      });

      updateGraphPositions();
    }

    root
      .querySelectorAll("[data-mode]")
      .forEach((button) => {
        button.addEventListener("click", () => {
          mode = button.dataset.mode;
          root
            .querySelectorAll("[data-mode]")
            .forEach((item) => item.classList.remove("active"));
          button.classList.add("active");
          refreshColors();
        });
      });

    function setupTimeline() {
      if (frames.length === 0) {
        timeControls.hidden = true;
        return;
      }

      timeControls.hidden = false;
      frameSlider.max = String(frames.length - 1);
      frameSlider.value = String(frameIndex);
      timeLabel.textContent = frames[frameIndex].label;
    }

    playButton.addEventListener("click", () => {
      if (frames.length === 0) {
        return;
      }

      if (timerId) {
        stopTimeline();
        return;
      }

      playButton.textContent = "Pausa";
      timerId = window.setInterval(() => {
        const nextIndex = frameIndex >= frames.length - 1 ? 0 : frameIndex + 1;
        applyFrame(nextIndex);
      }, 650);
    });

    frameSlider.addEventListener("input", () => {
      stopTimeline();
      applyFrame(Number(frameSlider.value));
    });

    function stopTimeline() {
      if (!timerId) {
        return;
      }

      window.clearInterval(timerId);
      timerId = null;
      playButton.textContent = "Play";
    }

    function applyFrame(index) {
      if (frames.length === 0) {
        return;
      }

      frameIndex = Math.min(Math.max(index, 0), frames.length - 1);
      const frame = frames[frameIndex];
      const valuesByNode = new Map(
        frame.nodes.map((item) => [item.id, item])
      );

      nodes.forEach((item) => {
        const frameNode = valuesByNode.get(item.id);

        if (!frameNode) {
          item.phases = { A: null, B: null, C: null };
          item.voltage = null;
          item.measurements = 0;
          return;
        }

        item.phases = frameNode.phases;
        item.voltage = frameNode.voltage;
        item.measurements = frameNode.measurements;
      });

      frameSlider.value = String(frameIndex);
      timeLabel.textContent = frame.label;
      saveFrameIndex();
      refreshColors();
      d3.select(svgElement).selectAll(".network-node title").text((item) => tooltipText(item));

      const activeNode = nodes.find((item) => item.id === activeId);

      if (activeNode) {
        renderInfo(activeNode);
      }
    }

    function clampFrameIndex(index, lastFrame) {
      const numericIndex = Number(index);

      if (!Number.isFinite(numericIndex)) {
        return 0;
      }

      return Math.min(
        Math.max(Math.trunc(numericIndex), 0),
        lastFrame
      );
    }

    function storageKey(kind) {
      return `network-d3-${kind}:${graphId}`;
    }

    function readJsonStorage(key) {
      try {
        return JSON.parse(window.localStorage.getItem(key));
      } catch (_error) {
        return null;
      }
    }

    function writeJsonStorage(key, value) {
      try {
        window.localStorage.setItem(key, JSON.stringify(value));
      } catch (_error) {
        return;
      }
    }

    function currentPositions() {
      const positions = {};

      nodes.forEach((item) => {
        if (!Number.isFinite(item.x) || !Number.isFinite(item.y)) {
          return;
        }

        positions[item.id] = {
          x: item.x,
          y: item.y,
          vx: Number.isFinite(item.vx) ? item.vx : 0,
          vy: Number.isFinite(item.vy) ? item.vy : 0,
        };
      });

      return positions;
    }

    function selectionPayload(item) {
      return {
        id: item.id,
        frameIndex,
        graphId,
        positions: currentPositions(),
      };
    }

    function restoreLayout(serverLayoutState) {
      const localLayoutState = readJsonStorage(storageKey("layout"));
      const layoutState = (
        serverLayoutState && serverLayoutState.graphId === graphId
      ) ? serverLayoutState : localLayoutState;

      if (!layoutState || layoutState.graphId !== graphId || !layoutState.positions) {
        return false;
      }

      let restoredAnyNode = false;

      nodes.forEach((item) => {
        const position = layoutState.positions[item.id];

        if (!position) {
          return;
        }

        const x = Number(position.x);
        const y = Number(position.y);

        if (!Number.isFinite(x) || !Number.isFinite(y)) {
          return;
        }

        item.x = x;
        item.y = y;
        item.vx = Number.isFinite(Number(position.vx)) ? Number(position.vx) : 0;
        item.vy = Number.isFinite(Number(position.vy)) ? Number(position.vy) : 0;
        restoredAnyNode = true;
      });

      return restoredAnyNode;
    }

    function saveLayout() {
      writeJsonStorage(
        storageKey("layout"),
        {
          graphId,
          positions: currentPositions(),
        }
      );
    }

    function saveLayoutThrottled() {
      const now = Date.now();

      if (now - lastLayoutSave < 450) {
        return;
      }

      lastLayoutSave = now;
      saveLayout();
    }

    function saveFrameIndex() {
      writeJsonStorage(
        storageKey("frame"),
        {
          graphId,
          frameIndex,
        }
      );
    }

    function updateGraphPositions() {
      d3.select(svgElement)
        .selectAll(".network-link")
        .attr("x1", (item) => item.source.x)
        .attr("y1", (item) => item.source.y)
        .attr("x2", (item) => item.target.x)
        .attr("y2", (item) => item.target.y);

      d3.select(svgElement)
        .selectAll(".network-node")
        .attr("transform", (item) => `translate(${item.x},${item.y})`);
    }

    function numericValues(item) {
      return phases
        .map((phase) => item.phases[phase])
        .filter((value) => Number.isFinite(value));
    }

    function nodeValue(item, activeMode) {
      const values = numericValues(item);

      if (activeMode === "A" || activeMode === "B" || activeMode === "C") {
        const phaseValue = item.phases[activeMode];
        return Number.isFinite(phaseValue) ? phaseValue : null;
      }

      if (values.length === 0) {
        return Number.isFinite(item.voltage) ? item.voltage : null;
      }

      if (activeMode === "min") {
        return Math.min(...values);
      }

      if (activeMode === "max") {
        return Math.max(...values);
      }

      if (activeMode === "spread") {
        return Math.max(...values) - Math.min(...values);
      }

      return values.reduce((acc, value) => acc + value, 0) / values.length;
    }

    function colorFor(value, fallback) {
      if (!Number.isFinite(value)) {
        return fallback || "#d9d9d9";
      }

      if (mode === "spread") {
        if (value <= 0.02) {
          return "#2ECC71";
        }

        if (value <= 0.05) {
          return "#F1C40F";
        }

        return "#E74C3C";
      }

      if (value >= 0.93 && value <= 1.05) {
        return "#2ECC71";
      }

      if (value >= 0.90 && value <= 1.08) {
        return "#F1C40F";
      }

      return "#E74C3C";
    }

    function refreshColors() {
      const node = d3.select(svgElement).selectAll(".network-node");

      node.each(function(item) {
        const group = d3.select(this);
        const circle = group.select(".node-fill");
        const phasePaths = group
          .selectAll("path.phase")
          .data(
            mode === "three"
              ? d3.pie().sort(null).value(1)(
                  phases.map((phase) => ({
                    phase,
                    value: item.phases[phase],
                  }))
                )
              : [],
            (phaseItem) => phaseItem.data.phase
          );

        phasePaths
          .join(
            (enter) => enter
              .append("path")
              .attr("class", "phase")
              .attr("stroke", "#ffffff")
              .attr("stroke-width", 1.2),
            (update) => update,
            (exit) => exit.remove()
          )
          .attr("d", d3.arc().innerRadius(0).outerRadius(18))
          .attr("fill", (phaseItem) => colorFor(phaseItem.data.value, item.baseColor));

        circle
          .attr("display", mode === "three" ? "none" : null)
          .attr("fill", colorFor(nodeValue(item, mode), item.baseColor));
      });
    }

    function refreshSelection() {
      const node = d3.select(svgElement).selectAll(".network-node");

      node.classed("selected", (item) => item.id === activeId);
      node
        .select(".node-ring")
        .attr("stroke-width", (item) => item.id === activeId ? 5.6 : 3.2)
        .attr("stroke", (item) => item.id === activeId ? "#111827" : item.borderColor);
    }

    function tooltipText(item) {
      const values = phases
        .map((phase) => {
          const value = item.phases[phase];
          return `${phase}: ${Number.isFinite(value) ? value.toFixed(4) : "sem medição"}`;
        })
        .join(" | ");

      return `${item.label} (${item.id})\n${values}\nMedições: ${item.measurements}`;
    }

    function renderInfo(item) {
      const rows = phases
        .map((phase) => {
          const value = item.phases[phase];
          const text = Number.isFinite(value) ? `${value.toFixed(4)} pu` : "sem medição";
          return `<span>${phase}</span><strong>${text}</strong>`;
        })
        .join("");

      info.hidden = false;
      info.innerHTML = `
        <div class="network-d3-card-title">${escapeHtml(item.label)}</div>
        <div class="network-d3-card-sub">${escapeHtml(item.type)} · ${escapeHtml(item.id)}</div>
        <div class="network-d3-card-grid">${rows}</div>
      `;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function drag(activeSimulation) {
      function dragstarted(event) {
        if (!event.active) {
          activeSimulation.alphaTarget(0.3).restart();
        }

        event.subject.fx = event.subject.x;
        event.subject.fy = event.subject.y;
      }

      function dragged(event) {
        event.subject.fx = event.x;
        event.subject.fy = event.y;
      }

      function dragended(event) {
        if (!event.active) {
          activeSimulation.alphaTarget(0);
        }

        event.subject.fx = null;
        event.subject.fy = null;
        saveLayout();
      }

      return d3.drag()
        .on("start", dragstarted)
        .on("drag", dragged)
        .on("end", dragended);
    }

    function updateFrameHeight(graphHeight) {
      window.requestAnimationFrame(() => {
        const measuredHeight = Math.ceil(root.getBoundingClientRect().height);
        Streamlit.setFrameHeight(measuredHeight || graphHeight + 92);
      });
    }
  </script>
</body>
</html>
